name: Himothee Stage 2 - Branding

on:
  workflow_dispatch:
  push:
    branches:
      - feature/branding

permissions:
  contents: read

jobs:
  windows-x64-branding:
    name: Windows x64 branding build
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout Himothee branding branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Restore OBS 32.2.2 version tag
        run: |
          git fetch https://github.com/obsproject/obs-studio.git refs/tags/32.2.2:refs/tags/32.2.2 --force
          Write-Host "Version description: $(git describe --always --tags --dirty=-modified)"

      - name: Build Himothee Studio
        uses: ./.github/actions/build-obs
        with:
          target: x64
          config: RelWithDebInfo

      - name: Validate Himothee Windows identity
        run: |
          $exe = Get-Item "$Env:GITHUB_WORKSPACE\build_x64\rundir\RelWithDebInfo\bin\64bit\obs64.exe"
          $info = $exe.VersionInfo
          Write-Host "ProductName: $($info.ProductName)"
          Write-Host "FileDescription: $($info.FileDescription)"
          Write-Host "FileVersion: $($info.FileVersion)"
          Write-Host "ProductVersion: $($info.ProductVersion)"
          if ($info.ProductName -ne 'Himothee Studio') { throw 'Windows ProductName is not Himothee Studio' }
          if ($info.FileDescription -ne 'Himothee Studio') { throw 'Windows FileDescription is not Himothee Studio' }

      - name: Package portable Windows build
        uses: ./.github/actions/package-obs
        with:
          target: x64
          config: RelWithDebInfo
          package: false

      - name: Upload Himothee Studio v0.2.0
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Himothee-Studio-v0.2.0-Windows-x64
          path: build_x64/obs-studio-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
