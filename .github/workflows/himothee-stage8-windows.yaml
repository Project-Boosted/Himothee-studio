name: Himothee Stage 8 - Audio Routing

on:
  workflow_dispatch:
  push:
    branches:
      - feature/audio-routing

permissions:
  contents: read

jobs:
  windows-x64-audio-routing:
    name: Windows x64 audio routing
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout audio routing branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Restore OBS 32.2.2 version tag
        run: |
          git fetch https://github.com/obsproject/obs-studio.git refs/tags/32.2.2:refs/tags/32.2.2 --force
          Write-Host "Version description: $(git describe --always --tags --dirty=-modified)"

      - name: Guard against committed stream keys
        run: |
          $matches = git grep -n -E '"key"[[:space:]]*:[[:space:]]*"[^"]{8,}"' -- ':!docs/himothee/**'
          if ($LASTEXITCODE -eq 0 -and $matches) {
            Write-Host $matches
            throw 'Possible stream key found in tracked source.'
          }
          exit 0

      - name: Build Himothee Studio audio routing
        uses: ./.github/actions/build-obs
        with:
          target: x64
          config: RelWithDebInfo

      - name: Validate Himothee v0.8.1 identity
        run: |
          $exe = Get-Item "$Env:GITHUB_WORKSPACE\build_x64\rundir\RelWithDebInfo\bin\64bit\obs64.exe"
          $info = $exe.VersionInfo
          Write-Host "ProductName: $($info.ProductName)"
          Write-Host "FileVersion: $($info.FileVersion)"
          if ($info.ProductName -ne 'Himothee Studio') { throw 'Wrong ProductName' }
          if ($info.FileVersion -ne '0.8.1') { throw 'Wrong Himothee version' }

      - name: Verify audio routing implementation
        run: |
          $manager = "$Env:GITHUB_WORKSPACE\frontend\utility\HimotheeMultistream.cpp"
          $dock = "$Env:GITHUB_WORKSPACE\frontend\docks\HimotheeMultistreamDock.cpp"

          foreach ($pattern in @(
            'audio_track',
            'selectedMixerIndex',
            'needsDedicatedAudio',
            'obs_audio_encoder_create',
            'destinationAudioEncoder'
          )) {
            if (-not (Select-String -Path $manager -Pattern $pattern -Quiet)) {
              throw "Audio routing implementation is missing: $pattern"
            }
          }

          foreach ($pattern in @(
            'Audio track',
            'MAX_AUDIO_MIXES',
            'Track %1',
            'dedicatedAudioEncoder'
          )) {
            if (-not (Select-String -Path $dock -Pattern $pattern -Quiet)) {
              throw "Audio routing UI is missing: $pattern"
            }
          }

      - name: Package Windows build
        uses: ./.github/actions/package-obs
        with:
          target: x64
          config: RelWithDebInfo
          package: false

      - name: Upload Himothee Studio v0.8.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Himothee-Studio-v0.8.1-Audio-Routing-Hotfix-Windows-x64
          path: build_x64/obs-studio-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
