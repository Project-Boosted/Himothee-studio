name: Himothee Stage 9.2 - Twitch Chat

on:
  workflow_dispatch:
  push:
    branches:
      - feature/twitch-chat

permissions:
  contents: read

jobs:
  windows-x64-twitch-chat:
    name: Windows x64 Twitch chat
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout Twitch chat branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Restore OBS 32.2.2 version tag
        run: |
          git fetch https://github.com/obsproject/obs-studio.git refs/tags/32.2.2:refs/tags/32.2.2 --force
          Write-Host "Version description: $(git describe --always --tags --dirty=-modified)"

      - name: Guard against committed credentials
        run: |
          $matches = git grep -n -E '(access_token|refresh_token|client_secret|stream_key)[[:space:]]*[:=][[:space:]]*"[^"]{8,}"' -- ':!docs/himothee/**'
          if ($LASTEXITCODE -eq 0 -and $matches) {
            Write-Host $matches
            throw 'Possible credential found in tracked source.'
          }
          exit 0

      - name: Build Himothee Studio Twitch chat
        uses: ./.github/actions/build-obs
        with:
          target: x64
          config: RelWithDebInfo

      - name: Validate Himothee v0.9.4 identity
        run: |
          $exe = Get-Item "$Env:GITHUB_WORKSPACE\build_x64\rundir\RelWithDebInfo\bin\64bit\obs64.exe"
          $info = $exe.VersionInfo
          Write-Host "ProductName: $($info.ProductName)"
          Write-Host "FileVersion: $($info.FileVersion)"
          if ($info.ProductName -ne 'Himothee Studio') { throw 'Wrong ProductName' }
          if ($info.FileVersion -ne '0.9.4') { throw 'Wrong Himothee version' }

      - name: Verify Twitch chat implementation
        run: |
          $provider = "$Env:GITHUB_WORKSPACE\frontend\chat\TwitchChatProvider.cpp"
          $dock = "$Env:GITHUB_WORKSPACE\frontend\docks\HimotheeChatDock.cpp"

          foreach ($pattern in @(
            'eventsub.wss.twitch.tv',
            'channel.chat.message',
            'user:read:chat',
            'session_welcome',
            'session_reconnect',
            'recentEnvelopeId'
          )) {
            if (-not (Select-String -Path $provider -Pattern $pattern -Quiet)) {
              throw "Twitch chat provider is missing: $pattern"
            }
          }

          foreach ($pattern in @(
            'Auto — My Channel',
            'Custom Channel',
            'Connect Twitch',
            'Disconnect Twitch'
          )) {
            if (-not (Select-String -Path $dock -Pattern $pattern -Quiet)) {
              throw "Twitch chat UI is missing: $pattern"
            }
          }

      - name: Package Windows build
        uses: ./.github/actions/package-obs
        with:
          target: x64
          config: RelWithDebInfo
          package: false

      - name: Upload Himothee Studio v0.9.4
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Himothee-Studio-v0.9.4-Twitch-Chat-Windows-x64
          path: build_x64/obs-studio-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
