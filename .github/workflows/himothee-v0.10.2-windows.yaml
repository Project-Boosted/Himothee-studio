name: Himothee v0.10.3 - Overlay Startup Hotfix

on:
  workflow_dispatch:
  push:
    branches:
      - feature/overlay-designer

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 overlay startup hotfix
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout overlay-designer branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Restore OBS 32.2.2 version tag
        run: |
          git fetch https://github.com/obsproject/obs-studio.git refs/tags/32.2.2:refs/tags/32.2.2 --force

      - name: Verify Stage 10.3 designer implementation
        run: |
          $engine = "$Env:GITHUB_WORKSPACE\frontend\overlays\HimotheeOverlayEngine.cpp"
          $engineHeader = "$Env:GITHUB_WORKSPACE\frontend\overlays\HimotheeOverlayEngine.hpp"
          $dock = "$Env:GITHUB_WORKSPACE\frontend\docks\HimotheeOverlayDock.cpp"

          foreach ($pattern in @(
            'himothee_dark',
            'background_opacity',
            'corner_radius',
            'HimotheeOverlayPositionId',
            'HimotheeOverlayAnimationId',
            '/media/',
            'media_opacity'
          )) {
            if (-not (Select-String -Path @($engine, $engineHeader) -Pattern $pattern -SimpleMatch -Quiet)) {
              throw "Overlay designer engine is missing: $pattern"
            }
          }

          foreach ($pattern in @(
            'Himothee Dark',
            'Minimal',
            'Neon',
            'Transparent',
            'Top Left',
            'Slide Up',
            'Media layer',
            'Choose Overlay Media'
          )) {
            if (-not (Select-String -Path @($engine, $engineHeader, $dock) -Pattern $pattern -SimpleMatch -Quiet)) {
              throw "Overlay designer implementation is missing: $pattern"
            }
          }

      - name: Verify startup lifecycle safety
        run: |
          $engine = Get-Content "$Env:GITHUB_WORKSPACE\frontend\overlays\HimotheeOverlayEngine.cpp" -Raw
          $dock = Get-Content "$Env:GITHUB_WORKSPACE\frontend\docks\HimotheeOverlayDock.cpp" -Raw

          $managerCtor = [regex]::Match(
            $engine,
            'HimotheeOverlayManager::HimotheeOverlayManager[\s\S]*?HimotheeOverlayManager::~HimotheeOverlayManager'
          ).Value

          if ($managerCtor -match 'LoadForCurrentProfile\(\);') {
            throw 'Overlay manager constructor still loads the profile too early.'
          }

          if ($managerCtor -match 'GetCurrentProfile\(') {
            throw 'Overlay manager constructor still reads the current profile too early.'
          }

          if ($managerCtor -match '(?m)^\s*UpdateRuntimeState\(\);\s*$') {
            throw 'Overlay manager constructor directly updates runtime state too early.'
          }

          $dockCtor = [regex]::Match(
            $dock,
            'HimotheeOverlayDock::HimotheeOverlayDock[\s\S]*?void HimotheeOverlayDock::BuildUi'
          ).Value

          if ($dockCtor -match 'ReloadFromManager\(\);') {
            throw 'Overlay dock constructor still reloads profile state too early.'
          }

          if ($dockCtor -match 'GetCurrentProfile\(') {
            throw 'Overlay dock constructor still reads the current profile too early.'
          }

          if ($dock -match 'main->GetCurrentProfile\(') {
            throw 'Overlay dock must not directly query the current profile.'
          }

          if ($engine -notmatch 'if \(!main \|\| !main->Config\(\)\)') {
            throw 'Overlay engine profile readiness guard is missing.'
          }

      - name: Build Himothee Studio
        uses: ./.github/actions/build-obs
        with:
          target: x64
          config: RelWithDebInfo

      - name: Validate v0.10.3 identity
        run: |
          $exe = Get-Item "$Env:GITHUB_WORKSPACE\build_x64\rundir\RelWithDebInfo\bin\64bit\obs64.exe"
          $info = $exe.VersionInfo
          Write-Host "ProductName: $($info.ProductName)"
          Write-Host "FileVersion: $($info.FileVersion)"
          if ($info.ProductName -ne 'Himothee Studio') { throw 'Wrong ProductName' }
          if ($info.FileVersion -ne '0.10.3') { throw 'Wrong Himothee version' }

      - name: Package Windows build
        uses: ./.github/actions/package-obs
        with:
          target: x64
          config: RelWithDebInfo
          package: false

      - name: Upload Himothee Studio v0.10.3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Himothee-Studio-v0.10.3-Overlay-Startup-Hotfix-Windows-x64
          path: build_x64/obs-studio-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
